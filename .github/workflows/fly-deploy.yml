name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create the Fly app if it does not exist yet
        run: |
          APP=$(grep -m1 '^app' fly.toml | cut -d'"' -f2)
          if ! flyctl status --app "$APP" >/dev/null 2>&1; then
            flyctl apps create "$APP" --org "${{ vars.FLY_ORG || 'personal' }}"
          fi

      - name: Deploy
        run: flyctl deploy --remote-only

      - name: Show the URL
        run: |
          APP=$(grep -m1 '^app' fly.toml | cut -d'"' -f2)
          echo "Deployed to https://$APP.fly.dev" >> "$GITHUB_STEP_SUMMARY"
